name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # ponytail: one page for everything; add --toc or split by year when it gets long
      - run: sudo apt-get install -y -qq pandoc
      - run: mkdir -p public && pandoc entries/*.md --standalone --shift-heading-level-by=1 --metadata title=minuti.ae -o public/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
